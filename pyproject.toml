[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paddleocr-hf"
version = "0.1.0"
description = "Pure PyTorch & Hugging Face Transformers implementation of PaddleOCR, PaddleOCRVL, and PPStructureV3 (Zero Paddle dependencies)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.8.0",
    "pillow>=10.0.0",
    "pypdfium2>=4.25.0",
    "safetensors>=0.4.0",
    "scipy>=1.11.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=5.23.0",
]

[project.scripts]
paddleocr = "paddleocr.__main__:console_entry"

[dependency-groups]
dev = [
    "pyright>=1.1.380",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/paddleocr"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src", "tests", "benchmarks"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
